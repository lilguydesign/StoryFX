name: StoryFX Internet foundation
on:
  pull_request:
    paths:
      - 'server/**'
      - 'dashboard/**'
      - 'android-agent/**'
      - 'ops/maintenance/**'
      - 'supabase/**'
      - 'deploy/**'
      - '.github/workflows/storyfx-foundation.yml'
  push:
    branches: [main, feature/internet-diagnostic-foundation]
    paths:
      - 'server/**'
      - 'dashboard/**'
      - 'android-agent/**'
      - 'ops/maintenance/**'
      - 'supabase/**'
      - 'deploy/**'
      - '.github/workflows/storyfx-foundation.yml'
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-lock.txt
      - run: python -m pip install -r server/requirements-lock.txt
      - run: python -B -m pytest server/tests ops/maintenance/test_storyfx_diagnostics_probe.py -q -p no:cacheprovider
      - name: Parse dashboard modules
        run: |
          for source in dashboard/*.js dashboard/login/*.js; do
            node --input-type=module --check < "$source"
          done
      - name: Parse deployment sources
        run: |
          python -m compileall -q deploy
          bash -n deploy/install_backend.sh
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/tests/storyfx_download_test.ts
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile diagnostic agent and run tests
        run: bash android-agent/gradlew -p android-agent :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
