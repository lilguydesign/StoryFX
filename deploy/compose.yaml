name: storyfx
services:
  storyfx-api:
    image: ${STORYFX_IMAGE:?versioned image required}
    container_name: storyfx-api
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - /opt/formafx/storyfx/state:/data
    ports:
      - 127.0.0.1:18451:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
